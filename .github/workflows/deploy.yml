name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          repository: MontassarHannachi/portfolio-deploy
          ref: main
          path: deployment
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ansible Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.22.0
          ansible-playbook --version

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:ci
          version: latest

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit with Ansible
        working-directory: deployment
        env:
          APP_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          ansible-playbook \
            -i inventory/hosts.ini \
            deploy.yml \
            --private-key "$HOME/.ssh/id_ed25519" \
            -e "app_version=${APP_COMMIT}"

      - name: Verify application HTTP response
        env:
          DEPLOY_HOST: 100.97.197.55
        run: |
          set -euo pipefail

          HTTP_CODE=$(ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${DEPLOY_HOST}" \
            'curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/')

          echo "Application HTTP status: ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"
